{% extends "booking/base.html" %}
{% block content %}
<section class="card">
    <p class="eyebrow">Selección de campaña</p>
    <h2>Campañas disponibles</h2>
    <div class="grid">
        {% for campaign in campaigns %}
            <article class="card alt">
                <h3>{{ campaign.name }}</h3>
                <p>Campaña activa lista para cargar vacunas, puntos y horarios asociados.</p>
                <a class="button primary" href="/schedule/?campaign={{ campaign.id }}">Agendar en esta campaña</a>
            </article>
        {% endfor %}
    </div>
</section>
{% endblock %}
